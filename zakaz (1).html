<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Спасибо за заказ — IceGear</title>
    <style>
        body {
            background-color: #3c4d7c;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 470px;
            margin: 60px auto;
            background: #e6ebf0;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.14);
            padding: 36px 32px 28px 32px;
            color: #2c355a;
        }
        h1 {
            color: #2c74c7;
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center;
            margin-bottom: 32px;
            font-size: 18px;
        }
        form label {
            display: block;
            margin-top: 16px;
            margin-bottom: 4px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #b0bfd8;
            font-size: 16px;
        }
        button {
            width: 100%;
            background: #2c74c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 18px;
            margin-top: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #23486b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Спасибо за заказ!</h1>
        <div class="subtitle">Хороший выбор 😉<br>Заполните данные для доставки:</div>
        <form>
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="phone" required placeholder="+7 (___) ___-__-__">

            <label for="email">Почта</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">

            <label for="address">Адрес для доставки</label>
            <textarea id="address" name="address" rows="3" required placeholder="Город, улица, дом, квартира"></textarea>

            <button type="submit">Отправить данные</button>
        </form>
    </div>
        </form>
        <div style="text-align:center; margin-top: 30px;">
            <a href="icegear.html" style="
                display:inline-block;
                color: #fff;
                padding: 10px 30px;
                border-radius: 25px;
                text-decoration: none;
                font-weight: bold;
                font-size: 1em;
            " onmouseover="this.style.background='#23a2f2';" onmouseout="this.style.background='#3b4b7a';">
                Вернуться на главную
            </a>
        </div>
    </div>
</body>
</html>
