<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отзывы | IceGear</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e9eef5;
      margin: 0;
    }
    .header {
      background: #3b4b7a;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header nav {
      display: flex;
      gap: 30px;
    }
    .header nav a {
      color: white;
      text-decoration: none;
    }
    .header nav a:hover {
      text-decoration: underline;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 16px #0001;
      padding: 30px;
    }
    h2 {
      color: #3b4b7a;
    }
    .review-list {
      margin-bottom: 30px;
    }
    .review {
      border-bottom: 1px solid #e0e7ef;
      padding: 10px 0;
      margin-bottom: 10px;
    }
    .review:last-child {
      border-bottom: none;
    }
    .review-author {
      font-weight: bold;
    }
   
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input, textarea, button {
      font-size: 1em;
      padding: 8px 10px;
      border-radius: 5px;
      border: 1px solid #c0c7d6;
    }
    button {
      background: #23a2f2;
      color: white;
      border: none;
      cursor: pointer;
      width: fit-content;
      padding: 10px 25px;
      font-weight: bold;
    }
    button:hover {
      background: #1e88c9;
    }

  </style>
</head>
<body>

  <div class="header">
    <span style="font-size: 2em; font-weight: bold; color: #23a2f2;">IceGear</span>
    <nav>
      <a href="icegear.html">На главную</a>
      <a href="about.html">о нас</a>
      <a href="account.html">личный кабинет</a>
    </nav>
  </div>

  <div class="container">
    <h2>Отзывы наших клиентов</h2>
    <div class="review-list">
      <div class="review">
        <span class="review-author">Аркадий:</span>
        Всё быстро привезли, качество отличное. Спасибо!
      </div>
      <div class="review">
        <span class="review-author">Виктория:</span>
        Брала защиту — довольна! Буду заказывать ещё.
      </div>
    </div>
    <h3>Оставьте свой отзыв:</h3>
    <form action="mailto:youremail@example.com" method="post" enctype="text/plain">
      <input type="text" name="Имя" placeholder="Ваше имя" required>
      <textarea name="Отзыв" placeholder="Ваш отзыв" required></textarea>
      <button type="submit">Отправить</button>
    </form>
    <p style="font-size: 0.93em; color:#888; margin-top:8px;">
      * Ваш отзыв будет добавлен после проверки.
    </p>
  </div>
</body>
</html>
